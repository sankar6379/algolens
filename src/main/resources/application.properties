spring.application.name=AlgoLens

# Database Configuration — Set DB_URL, DB_USERNAME, DB_PASSWORD in Render environment
spring.datasource.url=${DB_URL:jdbc:mysql://algolens-db-sankarganesh12122-3f0.i.aivencloud.com:26411/defaultdb?useSSL=true&trustServerCertificate=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
server.error.include-message=always
server.port=${PORT:${SERVER_PORT:8080}}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# AI / LLM Configuration
algolens.ai.provider=${AI_PROVIDER:groq}
algolens.ai.api-url=${AI_API_URL:https://api.groq.com/openai/v1/chat/completions}
algolens.ai.token=${AI_API_TOKEN:}
algolens.ai.model=${AI_MODEL:llama-3.3-70b-versatile}